<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2B49;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Inventory box icon -->
  <g transform="translate(25, 25)">
    <!-- Main box -->
    <rect x="5" y="10" width="40" height="35" fill="none" stroke="#ffffff" stroke-width="2.5" rx="2"/>
    
    <!-- Box lid -->
    <path d="M 7 10 L 20 4 L 45 4 L 58 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Items inside (shelves) -->
    <line x1="7" y1="20" x2="45" y2="20" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="7" y1="28" x2="45" y2="28" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="7" y1="36" x2="45" y2="36" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    
    <!-- UCG label -->
    <text x="26" y="48" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="bold" letter-spacing="1">UCG</text>
  </g>
</svg>
